# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Builds the PDF manual with TinyTeX, using --as-cran WITHOUT --no-manual.
# This is the step that catches raw Unicode in .Rd files (Greek letters,
# combining marks) that --no-manual skips in silence. Runs on merge rather
# than on every push because building the manual is slow.
#
# Adapted from this repo's former check-release.yaml (the CRAN submission
# gate), which already had setup-tinytex and a release trigger but still
# passed --no-manual to both args and build_args -- so it never actually
# built the manual. Trimmed to the standard's single ubuntu-release job and
# added push[main] so it also runs house-standard's check-manual.yaml role.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: Check manual

permissions: read-all

jobs:
  check-manual:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Install the package into the user library so that Quarto's subprocess
      # can resolve library(hvtiBoostmtree) during vignette rendering.
      - name: Install package for vignette rendering
        run: Rscript -e "install.packages('.', repos = NULL, type = 'source')"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: check-manual-results
          path: check
