# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # lintr is version-pinned: a release can add checks to an existing
          # linter and redden a green build with no change to the code.
          extra-packages: any::lintr@3.4.0, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          # NOT enforcing yet. hvtiBoostmtree carries 114 lints under the
          # committed .lintr (973 with bare defaults) -- almost all of it
          # upstream's formatting in R/, since this is a fork of
          # kogalur/boostmtree at v1.5.1.
          #
          # The .lintr already switches off object_name_linter, because those
          # 753 names ARE the public API and the notation of Pande et al.
          # (2017). Switching off the remaining formatting linters too would
          # make this pass, but an exemption wide enough to guarantee a green
          # badge is a badge asserting nothing.
          #
          # So the badge reports rather than gates here, deliberately, and it
          # is written down instead of quietly left false. See the tracking
          # issue for the 13 object_usage findings, which are the part of this
          # backlog actually worth acting on.
          LINTR_ERROR_ON_LINT: false

      - name: Upload lint results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lint-results
          path: lintr_results.json
